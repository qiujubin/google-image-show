<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>过滤器控制面板</title>
  <style>
    :root { --bg:#0f1318; --card:#181d24; --border:#2b3240; --text:#e8ecf1; --muted:#9aa3af; --accent:#3b82f6; --success:#22c55e; --danger:#ef4444; }
    html,body{ margin:0; padding:0; background:var(--bg); color:var(--text); font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,"PingFang SC","Microsoft Yahei",sans-serif; }
    .wrap{ width: 320px; padding: 14px; background:var(--card); border:1px solid var(--border); }
    h1{ font-size:16px; margin:0 0 8px; }
    .row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .muted{ color:var(--muted); font-size:12px; }
    .switch{ position:relative; width:46px; height:26px; background:#0c1116; border:1px solid var(--border); border-radius:999px; cursor:pointer; }
    .knob{ position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:#fff; transition:all .2s; }
    .on{ background:var(--accent); }
    .on .knob{ left:24px; background:#fff; }
    input[type=text]{ width:100%; box-sizing:border-box; margin-top:10px; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:#0c1116; color:var(--text); }
    .actions{ display:flex; gap:8px; margin-top:10px; }
    .btn{ appearance:none; border:none; padding:8px 10px; border-radius:8px; cursor:pointer; font-weight:600; }
    .btn.primary{ background:var(--accent); color:#fff; }
    .btn.secondary{ background:#0c1116; border:1px solid var(--border); color:var(--text); }
    .feedback{ margin-top:8px; font-size:12px; color:var(--muted); }
    .ok{ color:var(--success); }
    .err{ color:var(--danger); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>过滤器控制面板</h1>
    <div class="row">
      <div>
        <div class="muted">扩展开关</div>
      </div>
      <div id="toggle" class="switch"><span class="knob"></span></div>
    </div>
    <div class="muted" id="stateText">已启用</div>
    <div class="row" style="margin-top:8px">
      <div class="muted">过滤模式</div>
      <div class="seg" id="modeSeg">
        <button id="pModeAllow" class="active">允许</button>
        <button id="pModeBlock">屏蔽</button>
      </div>
    </div>

    <input id="domainInput" type="text" placeholder="快速添加域名，如 unsplash.com">
    <div class="actions">
      <button id="addTyped" class="btn primary">添加到当前模式</button>
      <button id="addCurrent" class="btn secondary">添加当前标签域名</button>
    </div>
    <div class="actions">
      <button id="openOptions" class="btn secondary" style="flex:1">打开完整设置</button>
      <button id="refilter" class="btn secondary" style="flex:1">本页重新过滤</button>
    </div>
    <div id="feedback" class="feedback">提示：添加顶级域名将匹配其子域名。</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
